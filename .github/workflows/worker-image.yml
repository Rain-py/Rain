name: Build and Deploy

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE_NAME: rain_worker

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build the Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} ./Worker/

      - name: Test the Docker image
        run: |
          docker run ${{ env.IMAGE_NAME }} -c 'import tensorflow as tf; print(tf.__version__)'
          docker run ${{ env.IMAGE_NAME }} -c 'import torch; print(torch.__version__)'

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Tag and Push the Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }} $IMAGE:${{ github.ref_name }}
          docker tag ${{ env.IMAGE_NAME }} $IMAGE:latest
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest
