name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install build dependencies
      run: |
        python -m pip install -U setuptools wheel build wheel
        python -m pip install twine
    - name: Build
      run: python -m build .
    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}  # Add your TestPyPI token as a secret in your repository
      run: python -m twine upload --repository testpypi dist/* --skip-existing --verbose --non-interactive --disable-progress-bar
