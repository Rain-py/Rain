syntax = "proto3";
package provision;

service provisioner {
    // send a Status and IPs
    rpc SendStatus(emptyMessage) returns (WorkerStatus) {}
    // define number of worker
    rpc DefineNWorkers(NumOfWorkers) returns (response) {}
    // to solve failure worker and send new worker IP
    rpc SolveFailureWorker(FailureWorker) returns (NewWorker) {}
  }

  enum Status{
    DOWN = 0;
    UP = 1;
  }
  message WorkerStatus{
    repeated string IPs = 1;
    repeated Status statuses = 2;
    repeated int32 ports = 3;
    repeated int32 ids = 4;
  }
  message NumOfWorkers{
    // suggested number of worker must receive from divider
    uint64 NumOfWorkers = 1;
  }
  message response {
    string message = 1;
  }

  message emptyMessage {
  }

  message FailureWorker {
    string worker_ip = 1;
    int32 worker_port = 2;
    int32 worker_id = 3;
  }

  message NewWorker {
    string new_worker_ip = 1;
    int32 new_worker_port = 2;
    int32 new_worker_status = 3;
  }