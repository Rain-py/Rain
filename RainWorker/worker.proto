syntax = "proto3";
package worker;
import "google/protobuf/empty.proto";

service worker {
    // worker downloads (recieves) a file
    rpc download(stream File) returns (DownloadFileResponse) {}
    // worker uploads (sends) a file
    rpc upload(MetaData) returns (stream UploadFileResponse) {}
    // execute file
    rpc Execute(ExecuteData) returns (ExecuteFileResponse) {}

    rpc StopWorker(StopSignal) returns (google.protobuf.Empty) {}
  }

  
  message MetaData {
    string filename = 1;
    string extension = 2;
  }
  // for downloading a file
  message File {

    oneof request {
      MetaData metadata = 1;
      bytes chunk_data = 2;
    }
  }
  message DownloadFileResponse {
    string message = 1;
  }
  // ------------------

  // for uploading a file
  message UploadFileResponse {
    bytes chunk_data = 1;
  }

  // -------------------
  // for execution
  message ExecuteData {
    string filename = 1;
    string extension = 2;
    string worker_id = 3;
    string iteration_num = 4;
  }
  message ExecuteFileResponse {
    string message = 1;
  }

  // -------------------
  // for stopping a worker
  message StopSignal {
    string message = 1;
  }
  